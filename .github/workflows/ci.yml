name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.11'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: sh tests/ci.sh
      - name: Package and test the actual candidate
        run: |
          python3 -B tools/release/package.py --output "$RUNNER_TEMP/crew-candidate"
          python3 -B tools/release/consume.py --archive "$RUNNER_TEMP/crew-candidate/crew-v$(cat VERSION).tar.gz" --sha256 "$(cut -d ' ' -f 1 "$RUNNER_TEMP/crew-candidate/SHA256SUMS")"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.python == '3.11'
        with:
          node-version: '22.20.0'
      - name: Verify the published skill installation path
        if: matrix.python == '3.11'
        run: python3 -B tests/skill-installers.py
